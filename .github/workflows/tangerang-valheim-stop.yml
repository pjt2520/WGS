name: Tangerang Valheim Safe Stop
on:
  push:
    branches: ['feature/tangerang-valheim-safe-stop', 'feature/tangerang-1.5.43-integration']
  pull_request:
    branches: ['feature/tangerang-service-foundation', 'feature/tangerang-valheim-safe-stop']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-windows-tests:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Compile, run synthetic Windows processes, and publish preview
        shell: powershell
        run: ./scripts/Build-ValheimStopPreview.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Tangerang-ValheimStop-preview-win-x64
          path: releases/ValheimStopPreview-*/
          retention-days: 14
          if-no-files-found: error
