name: Tangerang Discord PlayFab status validation

on:
  push:
    branches:
      - 'feature/discord-playfab-board'
  pull_request:
    branches:
      - 'feature/tangerang-integration'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build-and-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build WGS and ServiceHost
        run: dotnet build WindowsGameServer.sln --configuration Debug
      - name: Run health and Discord privacy tests
        run: dotnet run --project WGS.HealthChecks.Tests/WGS.HealthChecks.Tests.csproj --configuration Debug
      - name: Run Xbox/PlayFab and join-code tests
        run: dotnet run --project WGS.Crossplay.Tests/WGS.Crossplay.Tests.csproj --configuration Debug
